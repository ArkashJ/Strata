# Portfolio catalogue consumed by ``backend/scripts/tam_77_pipeline.py``.
#
# The pipeline is portfolio-agnostic. Pass a different portfolio file
# to size any new VC fund / accelerator / strategy desk through the
# same primitive/framework/evaluator DAG:
#
#     uv run python scripts/tam_77_pipeline.py --portfolio path/to/your.yaml
#
# Each entry only declares *who the company is* and any methodology
# constraints the spec calls out. Claude picks the framework, sources
# the primitives, and the evaluator does the math.

portfolio_name: "Benmore — TAM-77 (24 portfolio companies)"
default_geo_profile_hint: "global_saas"   # fallback if Claude cannot decide

companies:
  - name: "Kyber"
    slug: "kyber-pc-doc-gen"
    sector: "P&C insurance doc-gen"
    short_desc: "AI document generation for US P&C insurance carriers (policy docs, declarations, endorsements, ACORD forms). State-regulated by 50 US DOIs."
    spec_notes: "us_only_regulated. International P&C is a separate buyer set with different forms and regulators."

  - name: "Gather"
    slug: "gather-customer-research"
    sector: "AI customer research / VoC"
    short_desc: "AI customer-research agent for marketing teams. Replaces qualitative research, surveys, expert networks. Global SaaS."
    spec_notes: "global_saas. No regulatory gates."

  - name: "Echelon"
    slug: "echelon-servicenow-agents"
    sector: "ServiceNow development agents"
    short_desc: "AI agents that build/maintain ServiceNow applications. Sold to ServiceNow customers (F500 + global enterprises). Platform-bound."
    spec_notes: "global_saas via ServiceNow. Platform-bound to ServiceNow customer base."

  - name: "Endeavor"
    slug: "endeavor-mfg-back-office"
    sector: "Mfg/distribution back-office AI"
    short_desc: "AI workflow agents for manufacturing + distribution back-office (quote-to-cash, order management, ERP automation). Global industrial."
    spec_notes: "global_industrial. Realistic SAM is <20% of the total mfg back-office labor pool ($75B ceiling — apply addressability + capture)."

  - name: "Skyramp"
    slug: "skyramp-qa-automation"
    sector: "QA / test automation"
    short_desc: "AI test-generation and QA automation for software engineering teams. Global SaaS sold to eng orgs worldwide."
    spec_notes: "global_saas. Persona = BLS QA / software-dev headcount; cost = QA tool spend per dev."

  - name: "Supermemory"
    slug: "supermemory-ai-memory-infra"
    sector: "AI memory infra"
    short_desc: "Memory layer infra for AI applications (long-term context, retrieval). Sold as API to AI app devs globally. Infra-stack layer."
    spec_notes: "infra_layer. Size by sum of application markets enabled (agent platforms, copilots, chatbots) x memory share of AI infra spend."

  - name: "Numeral"
    slug: "numeral-tax-compliance"
    sector: "Sales-tax / VAT compliance"
    short_desc: "Sales-tax and VAT compliance automation for ecommerce + SaaS. US sales tax + EU VAT + APAC GST."
    spec_notes: "global_saas with jurisdictional compliance rules; share-shift from Avalara/Vertex incumbent market."

  - name: "SignalLabs"
    slug: "signallabs-healthcare-decision-ai"
    sector: "Healthcare decision AI"
    short_desc: "AI decision-intelligence layer for US health payers + provider systems. HIPAA-bound."
    spec_notes: "us_only_regulated. International healthcare AI is a separate stack."

  - name: "Zero RFI"
    slug: "zerorfi-construction-rfi"
    sector: "ConTech RFI / owner's-rep"
    short_desc: "AI for construction RFI / change-order management and owner's-rep workflow. US commercial construction."
    spec_notes: "us_only_regulated by procurement. Owner's-rep AI slice << $72B total construction services."

  - name: "Contrario AI"
    slug: "contrario-ai-recruiting"
    sector: "AI recruiting agents"
    short_desc: "AI agents for talent-acquisition teams (sourcing, screening, outreach). Global SaaS sold to TA teams worldwide."
    spec_notes: "global_saas. Comp set: Mercor, Paraform. Displacement of staffing-agency revenue."

  - name: "Miravoice"
    slug: "miravoice-phone-surveys"
    sector: "AI phone surveys / CATI"
    short_desc: "AI voice surveys replacing CATI (computer-aided telephone interviewing). Global market-research industry."
    spec_notes: "global_saas. Displacement of CATI labor + survey call-centers."

  - name: "PlayerZero"
    slug: "playerzero-code-quality"
    sector: "AI code quality / observability"
    short_desc: "AI code-quality and debug-assist tools for engineering teams. Global SaaS."
    spec_notes: "global_saas. Share of observability / APM spend (Datadog comp set)."

  - name: "Kaizen Labs"
    slug: "kaizen-labs-govtech"
    sector: "US state/local GovTech"
    short_desc: "AI-native resident-services and payments platform for US state + local governments."
    spec_notes: "us_only_regulated by procurement scope. Cooperative purchasing + state IT procurement rules."

  - name: "Sieve"
    slug: "sieve-multimodal-infra"
    sector: "Multimodal AI infra"
    short_desc: "Video and audio AI APIs for developers. Multimodal pipeline infra (processing, transformation, generation)."
    spec_notes: "infra_layer. Size by app markets enabled (video gen, video editing, content moderation, video search)."

  - name: "ST Labs"
    slug: "st-labs-ai-itsm"
    sector: "AI-native ITSM"
    short_desc: "AI-native ITSM platform competing with ServiceNow/Atlassian/Freshworks for IT teams. Global SaaS."
    spec_notes: "global_saas. Share-shift from ITSM incumbents (Atlassian, Freshworks)."

  - name: "Wraithwatch"
    slug: "wraithwatch-cyber-defense"
    sector: "Agentic cyber defense"
    short_desc: "Autonomous AI agents for cyber defense (SOC, incident response, pentest). Sold to F500 and government globally."
    spec_notes: "global_saas. Share of SecOps spend; SOC analyst + pentester labor displacement."

  - name: "Moda"
    slug: "moda-ai-design"
    sector: "AI brand-design agents"
    short_desc: "AI brand-design agents for marketing and content teams. Global SaaS sold to marketers worldwide."
    spec_notes: "global_saas. Displacement of design tools + agency spend."

  - name: "Minerva"
    slug: "minerva-ai-accounting-firm"
    sector: "AI-native accounting firm (US CPA)"
    short_desc: "AI-native accounting *firm* for US SMBs. Requires US CPA licensure for sign-off; firm structure regulated state-by-state."
    spec_notes: "us_only_regulated. Realistic SAM is single-digit % of $43B total SMB accounting services ceiling."

  - name: "Effective AI"
    slug: "effective-ai-insurance-knowledge"
    sector: "Insurance actuarial / underwriting AI"
    short_desc: "AI agents for insurance actuarial and underwriting knowledge work. Jurisdiction-bound (US state DOIs)."
    spec_notes: "us_only_regulated. Actuarial work is state-DOI-bound; cross-border ratemaking does not transfer."

  - name: "Melius"
    slug: "melius-creative-canvas"
    sector: "AI creative canvas / image+video gen"
    short_desc: "AI image / video generation canvas for marketers and creators. Global SaaS."
    spec_notes: "global_saas. Displacement of stock-photo + creative-agency spend."

  - name: "Accrual"
    slug: "accrual-ai-tax-software"
    sector: "AI tax software for US CPA firms"
    short_desc: "AI-native tax-preparation and accounting software for US CPA firms. US federal/state tax code only."
    spec_notes: "us_only_regulated. Share-shift from Intuit / Thomson Reuters / Wolters Kluwer."

