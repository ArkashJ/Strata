concept_slug: playerzero-code-quality
name: AI Debug-Assist Capture Rate of Observability Pool
description: 'Realistic share of the global observability/APM/code-quality spend that
  an AI code-quality/debug-assist layer like PlayerZero can capture. Decomposition:
  ~17% of observability spend is in the code-quality/debug-assist slice addressable
  by AI agents (excluding infra metrics, log storage, network monitoring which are
  not AI-debug-addressable); within that slice, PlayerZero competes with GitHub Copilot
  Workspace, Sentry AI, Datadog Bits AI, Cursor, and incumbents extending into AI
  debug — realistic capture for a pure-play AI debug vendor is ~45% of the addressable
  slice. 0.17 × 0.45 ≈ 0.077 → rounded to 0.08. This embeds addressability (which
  workloads AI can touch) and capture (competitive share).'
value: 0.08
