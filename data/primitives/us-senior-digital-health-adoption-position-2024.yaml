name: US senior digital-health adoption-curve position (modeled)
description: >-
  MODELED — not a sourced fact. Dimensionless position of the US 65+
  remote-patient-monitoring / digital-health market along its logistic adoption
  S-curve, on a 0 (no adoption) to 1 (saturation) maturity axis. Set at 0.45:
  past the early-adopter knee (Medicare RPM reimbursement live since 2019,
  growing CPT 99454 claims) but well short of mainstream saturation. Fed into
  logistic(position, midpoint, steepness); it does NOT itself assert an adopted
  headcount. Do not cite as fact.
