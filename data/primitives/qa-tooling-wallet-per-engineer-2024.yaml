name: QA / test tooling annual wallet per addressable engineer
description: 'Blended annual QA SaaS wallet share per addressable engineer ≈ $1,500.
  Built from public price points: BrowserStack/Sauce Labs/LambdaTest seat licenses
  ($30-50/mo ≈ $400-600/yr), Mabl/Testim/Functionize per-seat ($1k-2k/yr at enterprise),
  plus allocated internal test infra & CI minutes. Excludes full dev-tools spend (IDE,
  observability) to keep this a QA-specific capture wallet — represents the share
  an AI test-gen vendor can plausibly win, not total tooling spend.'
