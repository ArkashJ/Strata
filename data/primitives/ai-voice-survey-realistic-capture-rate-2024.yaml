name: Realistic AI voice survey capture rate of CATI spend pool
description: 'Capture rate reflects: (a) ~70% of CATI surveys are technically AI-voice-feasible
  today (consumer B2C quant studies, short instruments) - B2B/political/long-form
  complex skip-logic still need humans near-term; (b) within the feasible slice, a
  multi-vendor AI voice survey category can realistically consolidate ~50-60% of spend
  over a 5-7yr horizon (rest stays human due to client preference, regulatory constraints
  in EU). Net consolidation_rate = 0.70 x 0.55 = ~0.38.'
