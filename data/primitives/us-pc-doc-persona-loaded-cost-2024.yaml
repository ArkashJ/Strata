concept_slug: kyber-pc-doc-gen
name: Loaded annual cost per US P&C doc-gen persona
description: Fully-loaded annual cost per addressable persona. Blended BLS OES mean
  wage across underwriters (~$87K) and policy processing clerks (~$48K), weighted
  ~30/70 => ~$60K base wage. Apply 1.35x loading for benefits + overhead (BLS ECEC
  ratio for finance/insurance) => ~$81K. Kyber captures the document-drafting slice
  of this role (~30% of time spent on document assembly) => billable value per persona
  ~$24K/yr that a vendor can realistically price against.
