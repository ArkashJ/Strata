name: Global AI-addressable QA / test-equivalent developer personas
description: BLS OEWS reports ~1.9M US software developers + QA analysts/testers (SOC
  15-1252 + 15-1253). Scaling US -> global at ~2.3x (industry dev-population surveys
  put global devs at ~28M, but only ~4.4M sit at orgs with formal QA tooling budgets).
  Of those, ~25% of engineering time maps to QA/testing-equivalent work, and ~60%
  are at orgs mature enough to adopt AI test-gen in the medium term. Net addressable
  persona pool = 4.4M * 0.25 * 0.60 ≈ 660K personas. Addressability is embedded here,
  not in the framework.
