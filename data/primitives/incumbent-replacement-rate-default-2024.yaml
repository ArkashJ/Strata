name: Incumbent replacement rate (modeled structural default)
description: >-
  MODELED - not a sourced fact. The dimensionless fraction of an addressable persona base whose incumbent manual/legacy spend a new tool realistically REPLACES within a 3-year planning horizon (vs net-new or untouched). Set at 0.35 - a moderate displacement consistent with observed enterprise-software switching inertia. Scales the addressable base to the truly-displaced base; asserts no headcount. Do not cite as fact.
value: 0.35
unit:
  kind: dimensionless
  dimension: percent
