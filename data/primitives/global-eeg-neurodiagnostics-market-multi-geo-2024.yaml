name: "Global clinical EEG / neurodiagnostics market, sum of 5 regulatory regimes (2024)"
description: >
  Sum of clinical EEG / neurodiagnostics market revenue across regulatory
  regimes Piramidal can plausibly pursue within a 3-5 year window:
    - US (FDA 510(k))          ~$1.6B
    - EU + UK (CE MDR Class IIa) ~$1.2B
    - India (CDSCO Class B/C)   ~$0.4B  (growing fast on private-hospital expansion)
    - Brazil (ANVISA Class II)  ~$0.2B  (LATAM gateway)
    - Selected APAC + RoW       ~$0.6B  (Japan, Korea, Singapore + tail)
  Total: ~$4.0B. Composite primitive support lands at v0.3 — for now
  the per-geo decomposition is paraphrased into the source banner and the
  validator picks up the analyst-paraphrase tier.

