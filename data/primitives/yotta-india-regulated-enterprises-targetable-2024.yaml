name: "Indian regulated enterprises addressable by sovereign cloud (2024)"
description: >
  Count of Indian enterprises in regulated sectors (BFSI under RBI/IRDAI/SEBI;
  central + state government; large healthcare systems under DPDP localization;
  critical-infrastructure operators) with annual IT spend materially impacted
  by data-localization mandates and thus addressable by sovereign-DC providers
  like Yotta, CtrlS, NxtGen. Excludes SMBs and pure-export tech firms whose
  workloads can run on hyperscaler PoPs outside India.

