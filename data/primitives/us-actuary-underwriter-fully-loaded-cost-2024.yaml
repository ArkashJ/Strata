name: US Actuary/Underwriter Fully-Loaded Annual Cost
description: 'Blended fully-loaded cost across the actuary + underwriter mix. BLS
  OES 2023 mean wage: actuaries ~$132K, underwriters ~$87K. Weighted by headcount
  mix (20% actuary / 80% underwriter) = ~$96K base wage. Apply 1.4x fully-loaded multiplier
  (benefits, payroll tax, tooling, seat overhead) -> ~$135K per persona-year. This
  is the labor cost a carrier would substitute against when buying agentic automation.'
