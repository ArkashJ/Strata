name: US AI-addressable health payer/provider decision personas (HIPAA-bound)
description: 'Addressable subset of US health payer + provider decision workers whose
  workflow (prior auth, utilization review, clinical decisioning, care-pathway routing)
  is AI-eligible under HIPAA. Derived from BLS OES: medical/health services managers
  (11-9111 ~480K) + clinical-authorization slice of insurance claims/policy clerks
  (43-9041, ~150K of ~280K). Apply ~35% AI-eligibility filter for HIPAA-bound decisioning
  workflows -> ~220K addressable personas. Full pool (~700K) is NOT used; addressability
  is embedded here.'
