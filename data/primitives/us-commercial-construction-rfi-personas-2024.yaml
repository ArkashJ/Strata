name: US Commercial Construction RFI/Owner's-Rep Addressable Personas (2024)
description: Addressable US personas whose primary workflow includes RFI / change-order
  handling on commercial construction projects (owner's reps, project engineers, assistant
  PMs). Derived from BLS OES 11-9021 Construction Managers (~750K) restricted to commercial
  subset (~40%) and further restricted to RFI-touching seats (~60%), yielding ~180K
  addressable seats. This is NOT the full construction labor pool (~8M); the addressability
  narrowing is baked in here per Q15.
