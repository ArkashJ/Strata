  - 1200.0
  basis: >-
    Anchored on published Medicare RPM CPT reimbursement bands and consumer
    digital-health subscription pricing, blended across active and intermittent
    users. Low end ($240) = light consumer-only spend; high end ($1200) =
    continuously-reimbursed chronic-care monitoring. Range reflects that mix
    uncertainty.
