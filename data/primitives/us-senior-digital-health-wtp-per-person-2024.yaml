schema_version: 1
concept_slug: us-senior-digital-health
name: US senior digital-health willingness-to-pay per person per year (modeled)
description: >-
  MODELED — not a sourced fact. Blended annual willingness-to-pay per adopting
  US senior for a remote-patient-monitoring / digital-health subscription,
  combining consumer out-of-pocket spend and the Medicare RPM reimbursement an
  adopting beneficiary draws (CPT 99453/99454/99457 run roughly $100-160/month
  when active). Modeled at $480/year (~$40/month blended across active and
  intermittent users). Per ADOPTING person — the adopted share is applied
  separately via the logistic curve. Do not cite as fact.
value: 480.0
