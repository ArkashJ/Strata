name: "Share of clinical EEG market addressable by an AI foundation model (2024-2028, modeled)"
description: >
  Estimated share of the global clinical EEG / neurodiagnostics market that
  an AI foundation model can plausibly address in the 3-5 year window.
  Decomposes into: (a) reading / interpretation displacement (~60% of EEG
  read time is pattern-recognition that a foundation model handles well),
  (b) triage / prioritization (queue management, urgent vs routine), and
  (c) report generation / structured output for billing. Excludes: hardware,
  electrode manufacturing, in-person procedural fees. The 60% midpoint
  reflects what a credible AI-augmentation product (Piramidal-class) can
  charge against the read-fee economics; pure displacement (replacing
  neurologist sign-off) is regulatorily out of scope today. Community-
  modeled — refine once FDA / CE clinical-validation data lands.

