name: Platform market-share assumption (modeled structural default)
description: >-
  MODELED - not a sourced fact. The dimensionless long-run market share a single platform realistically captures of a throughput/GMV pool it competes for (after incumbents and multi-homing). Set at 0.15 - a credible durable share for a leading-but-not-monopoly platform. Scales a take-rate revenue pool to a single platform's slice; asserts no GMV. Do not cite as fact.
