name: US AI-Addressable Actuary + Underwriter Personas
description: 'BLS OES 2023 reports ~27,700 actuaries (SOC 15-2011) and ~108,400 insurance
  underwriters (SOC 13-2053) in the US, total ~136,100. Applying a 35% AI-addressability
  factor (knowledge-work tasks: rate analysis memos, submission triage, exposure scoring,
  reserving narratives) that are LLM-tractable within DOI-compliant guardrails yields
  ~47,600 addressable personas. The remaining 65% involves regulated sign-off, in-person
  broker relationships, and bespoke catastrophe modeling not yet automatable.'
