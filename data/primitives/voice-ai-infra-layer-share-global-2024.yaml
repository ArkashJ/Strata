name: "Voice-AI infra layer share of application stack revenue (2024, modeled)"
description: >
  Estimated share of voice-AI application stack revenue that accrues to the
  infra layer (TTS / STT / voice APIs) as the layer matures over the next
  3-5 years. Analog: cloud infrastructure (AWS / Azure / GCP) historically
  captures ~10-15% of total cloud spend; newer / higher-differentiation
  layers can capture more. Voice infra is in early growth (similar to cloud
  IaaS in 2010) so the 12.5% midpoint reflects today's pricing tension
  rather than a mature-market equilibrium. Community-modeled — flagged for
  downstream verification once voice-API ARR data from the 2026 vintage
  hyperscalers (Anthropic + OpenAI) is disclosed.

