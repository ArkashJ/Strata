name: Realistic AI-native share-shift capture of US CPA tax software incumbents
description: 'Estimated long-run (7-10 year) share an AI-native challenger can capture
  from Intuit/TR/WK in US CPA-firm tax software. Incumbents have deep moats: multi-year
  workpaper lock-in, IRS e-file MeF integrations, state-by-state form coverage (~50
  states x federal), and tight integration with practice-mgmt + audit suites. Historical
  precedent: cloud-native challengers (e.g., Canopy, TaxDome) captured ~10-20% over
  a decade in adjacent practice-mgmt. AI-native premium + generational CPA retirement
  supports 25% capture ceiling. This embeds the realistic capture %, not 100% displacement.'
