name: AI-addressable manufacturing + distribution back-office personas (global)
description: Starts from ~10M global manufacturing + wholesale distribution back-office
  workers (order management clerks, billing/AR/AP clerks, production planning clerks,
  purchasing clerks). BLS OES for the US shows ~2.5M such roles in mfg+wholesale;
  scaling by global mfg employment share (~4x US for OECD+major EM industrial economies
  on a quality-adjusted basis) yields ~10M. Apply 25% AI-addressability filter (roles
  whose tasks are document/workflow-heavy enough for agentic automation today, net
  of roles requiring shop-floor or physical presence). 10M * 0.25 = 2.5M addressable
  personas. Capture % is embedded in cost_per_persona (vendor priced at ~30% of fully-loaded
  labor cost).
