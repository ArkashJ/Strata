name: Realistic capture rate for AI-native GovTech challenger vs incumbents
description: Share of the incumbent resident-services + payments pool a credible AI-native
  challenger can realistically capture over the planning horizon. SLG procurement
  is sticky (5-10yr contracts, RFP cycles, cooperative purchasing gatekeeping); even
  fast-growing challengers like OpenGov and Granicus took ~15yrs to reach low-single-digit
  share. Bounded to 20-30% to reflect a successful but realistic share-shift, not
  full displacement.
