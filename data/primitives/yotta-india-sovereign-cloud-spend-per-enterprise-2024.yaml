name: "Sovereign-cloud + colocation spend per Indian regulated enterprise (2024)"
description: >
  Average annual spend on sovereign-cloud and colocation services per Indian
  regulated enterprise (BFSI, government, large healthcare, critical infra).
  Derived from Gartner / IDC India cloud market sizing: India sovereign cloud
  + DC services revenue ~$4B / 50K targetable enterprises = ~$80K average
  spend per enterprise per year. Power-law distribution — top-100 Indian
  banks and PSUs anchor most of the revenue; long tail spends materially less.

