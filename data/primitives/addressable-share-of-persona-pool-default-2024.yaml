name: Addressable share of a persona pool (modeled structural default)
description: >-
  MODELED - not a sourced fact. The dimensionless share of a raw occupational persona pool that is realistically ADDRESSABLE by a software vendor (employed at firms large enough to buy, in-scope sub-roles, not already saturated). Set at 0.60 as a neutral structural default between a fully-addressable pool (1.0) and a narrow niche (~0.3). It scales a headcount down to the serviceable base; it asserts no headcount itself. Do not cite as fact.
