description: >-
  MODELED — not a sourced fact. Annual net interest-plus-fee revenue a digital
  lender captures per active borrower in India, the willingness-to-pay proxy for
  a credit product. Modeled at $36/year (~INR 3,000): a small average ticket and
  short tenor typical of consumer/BNPL micro-credit, net of cost of funds. Per
  ADOPTING borrower — the adopted share is applied separately via the logistic
  curve. Do not cite as fact.
