name: Global AI-addressable qualitative market researcher personas
description: 'Addressable global pool of qualitative market research / VoC / insights
  personas that an AI customer-research agent can plausibly replace. Built from BLS
  SOC 13-1161 (Market Research Analysts) US headcount ~190K, scaled to ~250K globally
  for realistic SaaS-buying geos, then narrowed: 40% in qualitative/VoC roles (vs
  quant/pricing) * 60% in AI-adoption-ready orgs = 24% net addressability. 250K *
  0.24 ≈ 60K personas.'
