concept_slug: contrario-ai-recruiting
name: Realistic share of recruiting service spend captured by AI agent platforms
description: Share of incumbent recruiting service fees that AI-agent platforms (Mercor,
  Paraform, Contrario, etc.) can realistically displace over the planning horizon.
  Reflects (a) buyer willingness to in-source sourcing/screening with AI vs. retain
  human recruiters for relationship/closing work, (b) AI agent quality ceiling on
  senior/exec roles, (c) competitive split across many AI recruiting vendors. Modeled
  at 8% midpoint — aggressive but defensible given current category traction.
