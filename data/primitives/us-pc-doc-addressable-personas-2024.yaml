concept_slug: kyber-pc-doc-gen
name: US P&C insurance doc-generation addressable persona pool
description: AI-addressable subset of US P&C insurance back-office personas whose
  work product is policy document drafting, declarations, endorsements, and ACORD
  form assembly. Starts from BLS OES 13-2053 (Insurance Underwriters ~104K) + share
  of 43-9041 Insurance Claims & Policy Processing Clerks allocable to P&C policy docs
  (~220K of ~280K total, P&C share ~55% => ~120K) + ~25K policy drafting/compliance
  specialists. Total raw pool ~250K. Apply 60% AI-addressability for document-drafting
  tasks (the rest is judgment/underwriting decisions, customer contact, exception
  handling) => ~150K addressable personas. US-only; intl excluded.
