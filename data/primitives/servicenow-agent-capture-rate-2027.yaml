name: Realistic share of ServiceNow dev/maintenance spend addressable by AI agents
description: 'Share of the $27B ServiceNow services pool that AI dev agents can plausibly
  capture at maturity. Build/maintenance/testing/config tasks = ~60% of SI scope;
  AI agents realistically automate ~40% of that work (in line with GitHub Copilot
  enterprise productivity studies and early ServiceNow Now Assist data); vendor capture
  of that automated value = ~50% (rest accrues to customer savings + ServiceNow rev
  share). Net: 0.60 * 0.40 * 0.50 ≈ 12%.'
