name: Realistic AI-native ITSM share-capture rate
description: 'Share of the incumbent ITSM pool realistically displaceable by AI-native
  challengers (ST Labs and peers collectively) over a 5-7yr horizon. ServiceNow''s
  enterprise contracts (3-5yr terms, deep workflow customization) lock ~50% of the
  pool; Atlassian/Freshworks mid-market is more contestable (~40% displaceable). Blended:
  ~18% effective share-shift, reflecting (a) AI-native value prop strongest in L1/L2
  ticket deflection + agent productivity, (b) greenfield + mid-market peel-off first,
  (c) competitive response from incumbents (ServiceNow Now Assist, Atlassian Rovo)
  compressing the window.'
