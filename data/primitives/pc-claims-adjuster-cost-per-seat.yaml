kind: atomic_primitive
slug: pc-claims-adjuster-cost-per-seat
schema_version: 1
concept_slug: doc-gen-pc-insurance
name: "Doc-gen replacement cost per claims-adjuster seat (USD per seat per year)"
description: >
  Annual SaaS spend a P&C carrier would pay to replace one claims-adjuster's
  document-handling workload with AI-assisted doc-gen. Derived from BLS OES
  mean wages (13-1031) by applying a fractional pricing-capture multiplier
  (target ARR per seat = ~0.6% of fully-loaded labour cost), validated against
  observed price points at insurance-tech vendors. Treated as a regulator-tier
  derivation since the upstream wage data is BLS-sourced; the multiplier is
  recorded in `derives_from` for lineage.

