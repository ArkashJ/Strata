name: Capturable annual cost per US healthcare decision persona
description: Annual $ a HIPAA-bound decision-AI vendor can credibly capture per addressable
  persona. Fully-loaded labor cost is ~$110-140K (BLS OES median wage ~$80-104K x
  1.3 benefits load). Decision-AI captures a realistic ~40-50% value split (productivity
  assist, not full replacement) -> ~$55K/persona/yr. Capture % is embedded in the
  value per Q15.
