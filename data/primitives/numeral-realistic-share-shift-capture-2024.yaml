description: 'Numeral targets the ecommerce + SaaS slice of the incumbent pool (Shopify/Stripe-native
  sellers, digital subscriptions) where API-first UX wins. Embedded multipliers: addressable
  slice of pool that is API-amenable mid-market digital sellers ~50% of $3.8B pool;
  realistic long-run challenger capture vs Avalara/Vertex/Sovos entrenchment ~35%
  of that addressable slice. Combined effective consolidation_rate = 0.50 × 0.35 ≈
  17.5%. Yields ~$0.66B SAM, consistent with a modern challenger in a regulated incumbent
  market.'
