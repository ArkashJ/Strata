uncertainty:
  range:
  - 0.2
  - 0.45
  basis: >-
    Inferred from internet/smartphone penetration and digital-lending traction,
    not measured. Could be 0.20 if credit-eligibility and regulation constrain
    reach, or 0.45 if UPI-credit and account-aggregator rails accelerate uptake.
    Range reflects that uncertainty.
