kind: atomic_primitive
slug: india-digital-lending-adoption-position-2024
schema_version: 1
concept_slug: india-consumer-digital-lending
name: India consumer digital-lending adoption-curve position (modeled)
description: >-
  MODELED — not a sourced fact. Dimensionless position of India's
  smartphone-delivered consumer digital-lending market along its logistic
  adoption S-curve, on a 0 (no adoption) to 1 (saturation) maturity axis. Set at
  0.30: meaningful traction (UPI rails, ~56% internet penetration per World Bank
  IT.NET.USER.ZS 2022, RBI digital-lending guidelines) but still early — most of
  the population is not yet a digital-credit borrower. Fed into
  logistic(position, midpoint, steepness); it does NOT itself assert a borrower
  count. Do not cite as fact.
value: 0.3
unit:
  kind: dimensionless
  dimension: percent
as_of: '2024-12-31'
geo:
  level: country
