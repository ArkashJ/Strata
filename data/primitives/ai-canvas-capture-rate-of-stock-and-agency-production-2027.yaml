name: Realistic AI creative canvas capture rate of stock + agency production pool
description: Share of the combined stock-media + addressable agency-production pool
  that AI-native creative canvas tools (Melius, Canva AI, Adobe Firefly tier, Runway,
  etc.) credibly capture in steady state. Stock media is more displaceable (~35-40%)
  since gen-AI directly substitutes; agency production is partially displaceable (~15-20%)
  as agencies retain brand/strategy and adopt AI internally. Blended ≈ 22%.
