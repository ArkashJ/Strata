name: "Voice-AI application stack revenue, global, sum of 8 sub-markets (2024)"
description: >
  Total annual revenue of the application markets that voice AI infra
  enables, summed across eight sub-markets:
    1. Contact-center automation (Genesys / NICE / Five9 incumbent layer
       being modernized by AI) — ~$20B (EDGAR + industry reports).
    2. AI customer-service agents (Decagon, Sierra AI, Ada serving Grubhub,
       Notion, etc.) — ~$15B emerging ARR slice of the $80B contact-center
       labour pool.
    3. QSR / food-delivery voice agents (Giga ML, Bland AI serving Wendy's,
       McDonald's, Grubhub) — ~$5B phone-order automation TAM.
    4. Outbound sales / scheduling / booking voice agents — ~$8B
       (cold-calling automation, healthcare scheduling, salon booking).
    5. Audiobooks — ~$5B (Audible parent + industry data).
    6. Media localization / dubbing — ~$50B global media localization industry.
    7. Accessibility (screen readers, voice UI) — ~$2B assistive-tech market.
    8. Game / character voice — ~$3B game audio production.
  Sum: ~$108B addressable application stack revenue, 2024.

