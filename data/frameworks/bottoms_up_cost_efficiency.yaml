kind: framework
slug: bottoms-up-cost-efficiency
schema_version: 1
name: "Bottoms-up cost efficiency"

# Q7 method family — independence scoring downstream warns when triangulation
# uses two frameworks from the same family.
method_family: bottoms_up_seats

# Q39 lens tag. Concept's declared lens (primary OR secondary) must equal this
# value; the cross-record validator enforces the agreement.
lens: cost_efficiency

# v0.2 simplification: 2-input persona × seat-cost product. The full Q39
# cost_efficiency math (persona × addressable × replacement × cost) lands when
# the community-modeled slider primitives for addressable_share and
# replacement_rate are seeded (slated for v0.3, see
# plans/data-collection-strategy.md).
inputs:
  - name: persona_pool
    role: base_value
    unit_signature:
      kind: stock
      dimension: people
    required: true
  - name: cost_per_persona
    role: base_value
    unit_signature:
      kind: intensive
      dimension: currency
      currency: USD
    required: true

formula: "persona_pool * cost_per_persona"

output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: "per-year"

applicable_to:
  - doc-gen-pc-insurance
  - gtm-ops-tooling-na
  - skyramp-qa-automation
  - kyber-pc-doc-gen
  - gather-customer-research
  - endeavor-mfg-back-office
  - signallabs-healthcare-decision-ai
  - zerorfi-construction-rfi
  - wraithwatch-cyber-defense
  - effective-ai-insurance-knowledge
  - ai-coding-assistants-us
  - ai-legal-assistants-us

variants:
  # SP-1: persona_pool bound to a COMPOSITE (5112 ∪ 5415 employees) — the first
  # composite-backed variant; the evaluator computes the union before the
  # framework's persona × seat-cost multiply (Q3 line held).
  - scope: ai-coding-assistants-us
    default_inputs:
      persona_pool: us-software-engineering-workforce
      cost_per_persona: ai-coding-assistant-acv-per-engineer-2024
  - scope: ai-legal-assistants-us
    default_inputs:
      persona_pool: census-cbp-5411-employees-2022
      cost_per_persona: ai-legal-assistant-acv-per-seat-2024
  - scope: doc-gen-pc-insurance
    default_inputs:
      persona_pool: bls-pc-claims-adjusters-headcount
      cost_per_persona: pc-claims-adjuster-cost-per-seat
  - scope: gtm-ops-tooling-na
    default_inputs:
      persona_pool: bls-sales-reps-headcount-2024
      cost_per_persona: gtm-ops-tool-cost-per-rep-2024
  - scope: skyramp-qa-automation
    default_inputs:
      persona_pool: global-ai-addressable-qa-personas-2024
      cost_per_persona: qa-tooling-spend-per-dev-2024
  - scope: kyber-pc-doc-gen
    default_inputs:
      persona_pool: us-pc-doc-addressable-personas-2024
      cost_per_persona: us-pc-doc-persona-loaded-cost-2024
  - scope: gather-customer-research
    default_inputs:
      persona_pool: global-ai-addressable-qual-researchers-2024
      cost_per_persona: vendor-capture-per-qual-researcher-2024
  - scope: endeavor-mfg-back-office
    default_inputs:
      persona_pool: global-mfg-distribution-ai-addressable-backoffice-personas-2024
      cost_per_persona: global-mfg-backoffice-vendor-capture-per-persona-2024
  - scope: signallabs-healthcare-decision-ai
    default_inputs:
      persona_pool: us-ai-addressable-payer-provider-decision-personas-2024
      cost_per_persona: us-decision-ai-capturable-cost-per-persona-2024
  - scope: zerorfi-construction-rfi
    default_inputs:
      persona_pool: us-commercial-construction-rfi-personas-2024
      cost_per_persona: construction-rfi-ai-acv-per-seat-2024
  - scope: wraithwatch-cyber-defense
    default_inputs:
