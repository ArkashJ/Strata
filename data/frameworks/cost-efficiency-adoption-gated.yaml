kind: framework
slug: cost-efficiency-adoption-gated
schema_version: 1
name: Cost efficiency (adoption-gated displacement)

# Q39 lens — cost_efficiency. Distinct math shape: instead of a linear replacement
# fraction, the displaced share is gated by a saturating adoption curve over the
# replacement_rate, modelling that displacement of entrenched manual workflows
# accelerates then saturates rather than scaling linearly. persona_pool x
# addressable_share x curve(replacement_rate, adoption_steepness) x cost_per_persona.
# Covers all four required cost_efficiency roles.
method_family: adoption_curve
lens: cost_efficiency
inputs:
- name: persona_pool
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: replacement_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: cost_per_persona
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_pool * addressable_share * curve(replacement_rate, adoption_steepness) * cost_per_persona
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- ai-coding-assistants-us
- doc-gen-pc-insurance
variants:
- scope: ai-coding-assistants-us
  default_inputs:
    persona_pool: us-software-engineering-workforce
    addressable_share: addressable-share-of-persona-pool-default-2024
    replacement_rate: incumbent-replacement-rate-default-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    cost_per_persona: ai-coding-assistant-acv-per-engineer-2024
- scope: doc-gen-pc-insurance
  default_inputs:
    persona_pool: bls-pc-claims-adjusters-headcount
    addressable_share: addressable-share-of-persona-pool-default-2024
    replacement_rate: incumbent-replacement-rate-default-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    cost_per_persona: pc-claims-adjuster-cost-per-seat
expansion_stage_parameter: false
horizon_class: snapshot
