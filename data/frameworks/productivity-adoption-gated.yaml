kind: framework
slug: productivity-adoption-gated
schema_version: 1
name: Productivity uplift (adoption-gated gain)

# Q39 lens — productivity_uplift. Distinct math shape: realized productivity gain
# is gated by a saturating adoption curve (uplift ramps then saturates as the
# persona base learns the tool) rather than entering linearly. persona_count x
# curve(productivity_gain_pct, adoption_steepness) x value_split_to_vendor. Covers
# all three required productivity_uplift roles.
method_family: adoption_curve
lens: productivity_uplift
inputs:
- name: persona_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: productivity_gain_pct
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: value_split_to_vendor
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_count * curve(productivity_gain_pct, adoption_steepness) * value_split_to_vendor
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- software-eng-productivity
variants:
- scope: software-eng-productivity
  default_inputs:
    persona_count: bls-software-developers-us-2024
    productivity_gain_pct: productivity-gain-pct-default-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    value_split_to_vendor: dev-tool-arpu-2024
expansion_stage_parameter: false
horizon_class: snapshot
