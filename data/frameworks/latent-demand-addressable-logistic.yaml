kind: framework
slug: latent-demand-addressable-logistic
schema_version: 1
name: Latent demand (addressable-narrowed logistic)

# Q39 lens — latent_demand. Distinct math shape from latent-demand-adoption-curve:
# it narrows the raw population by an addressable share BEFORE the logistic curve,
# so the diffusion applies only to the serviceable base, not the whole population.
# addressable_population x addressable_share x logistic(pos,mid,steep) x WTP.
# Covers all three required latent_demand roles.
method_family: adoption_curve
lens: latent_demand
inputs:
- name: addressable_population
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_rate_curve
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_midpoint
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: willingness_to_pay
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: addressable_population * addressable_share * logistic(adoption_rate_curve, adoption_midpoint, adoption_steepness) * willingness_to_pay
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- us-senior-digital-health
- india-consumer-digital-lending
variants:
- scope: us-senior-digital-health
  default_inputs:
    addressable_population: wb-us-population-65up-2023
    addressable_share: addressable-share-of-persona-pool-default-2024
    adoption_rate_curve: us-senior-digital-health-adoption-position-2024
    adoption_midpoint: logistic-adoption-midpoint-default-2024
    adoption_steepness: logistic-adoption-steepness-default-2024
    willingness_to_pay: us-senior-digital-health-wtp-per-person-2024
- scope: india-consumer-digital-lending
  default_inputs:
    addressable_population: wb-india-population-2023
    addressable_share: addressable-share-of-persona-pool-default-2024
    adoption_rate_curve: india-digital-lending-adoption-position-2024
    adoption_midpoint: logistic-adoption-midpoint-default-2024
    adoption_steepness: logistic-adoption-steepness-default-2024
    willingness_to_pay: india-digital-lending-wtp-per-person-2024
expansion_stage_parameter: false
horizon_class: snapshot
