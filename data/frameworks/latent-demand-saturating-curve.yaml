kind: framework
slug: latent-demand-saturating-curve
schema_version: 1
name: Latent demand (saturating-exponential curve)

# Q39 lens — latent_demand. STRUCTURALLY DISTINCT from latent-demand-adoption-curve
# (which uses the logistic S-curve): this uses the saturating-exponential diffusion
# shape curve(position, k) = 1 - e^(-k*position), which has NO slow early-adopter
# knee (immediate concave take-up). It is a genuinely different adoption math, not
# a re-parameterization. addressable_population x curve(adoption_rate_curve, k) x WTP.
# Covers all three required latent_demand roles.
method_family: adoption_curve
lens: latent_demand
inputs:
- name: addressable_population
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: adoption_rate_curve
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: willingness_to_pay
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: addressable_population * curve(adoption_rate_curve, adoption_steepness) * willingness_to_pay
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- us-senior-digital-health
- india-consumer-digital-lending
variants:
- scope: us-senior-digital-health
  default_inputs:
    addressable_population: wb-us-population-65up-2023
    adoption_rate_curve: us-senior-digital-health-adoption-position-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    willingness_to_pay: us-senior-digital-health-wtp-per-person-2024
- scope: india-consumer-digital-lending
  default_inputs:
    addressable_population: wb-india-population-2023
    adoption_rate_curve: india-digital-lending-adoption-position-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    willingness_to_pay: india-digital-lending-wtp-per-person-2024
expansion_stage_parameter: false
horizon_class: snapshot
