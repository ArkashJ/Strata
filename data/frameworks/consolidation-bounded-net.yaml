kind: framework
slug: consolidation-bounded-net
schema_version: 1
name: Consolidation bounded net capture

# Q39 lens — bundle_consolidation. Distinct math shape: the net realized fraction
# (consolidation_rate netted by the bundling give-back) is clamped into [0,1] so
# it can never exceed the displaced pool. tools_displaced x
# clamp(consolidation_rate * (1 - pricing_discount), 0, 1). NOTE: spend_per_tool
# role still needs a sourced per-tool primitive (recorded gap) — same honest
# limitation as consolidation-net-of-bundling-discount.
method_family: comparable_revenue
lens: bundle_consolidation
inputs:
- name: tools_displaced
  role: base_value
  unit_signature:
    kind: flow
    dimension: currency
    currency: USD
  required: true
- name: consolidation_rate
  role: base_value
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: pricing_discount
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: tools_displaced * clamp(consolidation_rate * (1 - pricing_discount), 0, 1)
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- workplace-suite-consolidation
- numeral-tax-compliance
- minerva-ai-accounting-firm
variants:
- scope: workplace-suite-consolidation
  default_inputs:
    tools_displaced: enterprise-workplace-point-solution-spend-2024
    consolidation_rate: consolidation-capture-rate-2024
    pricing_discount: suite-bundling-pricing-discount-default-2024
- scope: numeral-tax-compliance
  default_inputs:
    tools_displaced: global-sales-tax-vat-compliance-software-revenue-2024
    consolidation_rate: numeral-realistic-share-shift-capture-2024
    pricing_discount: suite-bundling-pricing-discount-default-2024
- scope: minerva-ai-accounting-firm
  default_inputs:
    tools_displaced: us-smb-accounting-services-revenue-2024
    consolidation_rate: ai-native-cpa-firm-realistic-capture-rate-2024
    pricing_discount: suite-bundling-pricing-discount-default-2024
expansion_stage_parameter: false
horizon_class: snapshot
