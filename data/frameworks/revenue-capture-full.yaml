kind: framework
slug: revenue-capture-full
schema_version: 1
name: Revenue capture (full, with capture rate)

# Q39 lens — revenue_generation. FULL-role-coverage variant of the v0.2 2-input
# top-down-revenue-capture: it does not assume 100% of segment spend is winnable;
# it applies a sourced/modeled capture_rate. target_segment_count x
# spend_per_target x capture_rate. Clears the revenue_generation role warning.
method_family: top_down_spend
lens: revenue_generation
inputs:
- name: target_segment_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: organizations
  required: true
- name: spend_per_target
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
- name: capture_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: target_segment_count * spend_per_target * capture_rate
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- midmarket-saas-spend-na
- doc-gen-pc-insurance
variants:
- scope: midmarket-saas-spend-na
  default_inputs:
    target_segment_count: census-midmarket-companies-na-2024
    spend_per_target: avg-saas-spend-midmarket-2024
    capture_rate: consolidation-capture-rate-2024
- scope: doc-gen-pc-insurance
  default_inputs:
    target_segment_count: naic-active-pc-carriers-2024
    spend_per_target: pc-saas-spend-per-carrier-2024
    capture_rate: consolidation-capture-rate-2024
expansion_stage_parameter: false
horizon_class: snapshot
