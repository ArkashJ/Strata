kind: framework
slug: throughput-bounded-yield
schema_version: 1
name: Throughput bounded yield

# Q39 lens — platform_throughput. Distinct math shape: the realized yield
# (take_rate x platform share) is clamped into [0,1] so stacked fractions cannot
# imply capturing more than the whole throughput pool. gmv_or_volume x
# clamp(take_rate * market_share_assumption, 0, 1). Full role coverage.
method_family: value_chain
lens: platform_throughput
parent_lens_shape: throughput-take-rate-with-share
realism_modifiers: [bounded]
inputs:
- name: gmv_or_volume
  role: base_value
  unit_signature:
    kind: flow
    dimension: currency
    currency: USD
  required: true
- name: take_rate
  role: base_value
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: market_share_assumption
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: gmv_or_volume * clamp(take_rate * market_share_assumption, 0, 1)
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- payments-throughput-pc-insurance
- supermemory-ai-memory-infra
- sieve-multimodal-infra
variants:
- scope: payments-throughput-pc-insurance
  default_inputs:
    gmv_or_volume: pc-premium-volume-digital-us-2024
    take_rate: payment-processing-take-rate-2024
    market_share_assumption: platform-market-share-assumption-default-2024
- scope: supermemory-ai-memory-infra
  default_inputs:
    gmv_or_volume: global-ai-application-stack-revenue-2024
    take_rate: memory-layer-share-of-ai-app-stack-2024
    market_share_assumption: platform-market-share-assumption-default-2024
- scope: sieve-multimodal-infra
  default_inputs:
    gmv_or_volume: global-multimodal-video-audio-app-stack-revenue-2024
    take_rate: multimodal-ai-infra-share-of-app-stack-2024
    market_share_assumption: platform-market-share-assumption-default-2024
expansion_stage_parameter: false
horizon_class: snapshot
