kind: framework
slug: cost-efficiency-full-displacement
schema_version: 1
name: Cost efficiency (full displacement)

# Q39 lens — cost_efficiency. Distinct math shape from the v0.2 2-input
# bottoms-up-cost-efficiency: this is the FULL-role-coverage variant. It does not
# treat the raw persona pool as the addressable base; it narrows the pool by an
# addressable share and an incumbent replacement rate before applying per-persona
# cost. persona_pool x addressable_share x replacement_rate x cost_per_persona.
# Clears the standing role-coverage warning for cost_efficiency.
method_family: bottoms_up_seats
lens: cost_efficiency
inputs:
- name: persona_pool
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: replacement_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: cost_per_persona
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_pool * addressable_share * replacement_rate * cost_per_persona
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- ai-coding-assistants-us
- ai-legal-assistants-us
- doc-gen-pc-insurance
- gtm-ops-tooling-na
- skyramp-qa-automation
- wraithwatch-cyber-defense
- effective-ai-insurance-knowledge
- demo-ai-dev-tooling-us
- demo-ai-sales-ops-us
variants:
