kind: framework
slug: throughput-take-rate
schema_version: 1
name: "Throughput take-rate"

# Q7 method family — value_chain (processor captures basis-point yield on GMV).
method_family: value_chain

# Q39 lens tag — platform_throughput (Stripe/Plaid math shape).
lens: platform_throughput
parent_lens_shape: throughput-take-rate-with-share
realism_modifiers: [reduced]

# v0.2 simplification: 2-input GMV × take-rate product. The full Q39
# platform_throughput math (GMV × take × share_digital) lands when a
# digital-channel-share primitive is seeded at v0.3.
inputs:
  - name: gmv_or_volume
    role: base_value
    unit_signature:
      kind: flow
      dimension: currency
      currency: USD
    required: true
  - name: take_rate
    role: base_value
    unit_signature:
      kind: dimensionless
      dimension: percent
    required: true

formula: "gmv_or_volume * take_rate"

output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: "per-year"

applicable_to:
  - payments-throughput-pc-insurance
  - voice-ai-infra-global
  - piramidal-eeg-multi-geo
  - supermemory-ai-memory-infra
  - sieve-multimodal-infra

variants:
  - scope: payments-throughput-pc-insurance
    default_inputs:
      gmv_or_volume: pc-premium-volume-digital-us-2024
      take_rate: payment-processing-take-rate-2024
  - scope: voice-ai-infra-global
    default_inputs:
      gmv_or_volume: voice-ai-application-stack-revenue-global-2024
      take_rate: voice-ai-infra-layer-share-global-2024
  - scope: piramidal-eeg-multi-geo
    default_inputs:
      gmv_or_volume: global-eeg-neurodiagnostics-market-multi-geo-2024
      take_rate: eeg-ai-foundation-model-addressability-2024
  - scope: supermemory-ai-memory-infra
    default_inputs:
      gmv_or_volume: global-ai-application-stack-revenue-2024
      take_rate: memory-layer-share-of-ai-app-stack-2024
  - scope: sieve-multimodal-infra
    default_inputs:
      gmv_or_volume: global-multimodal-video-audio-app-stack-revenue-2024
      take_rate: multimodal-ai-infra-share-of-app-stack-2024

expansion_stage_parameter: false
horizon_class: snapshot
