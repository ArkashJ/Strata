kind: framework
slug: consolidation-net-of-bundling-discount
schema_version: 1
name: Consolidation net of bundling discount

# Q39 lens — bundle_consolidation. Distinct math shape from the v0.2 2-input
# consolidation-sum-then-discount: it nets the captured spend down by the suite
# bundling discount the vendor must give back vs the standalone stack it
# displaces. tools_displaced (displaced spend pool) x consolidation_rate x
# (1 - pricing_discount). NOTE: a fully role-covered variant additionally needs a
# per-tool spend_per_tool primitive; none is sourced yet (recorded as a gap), so
# this adds the genuinely-available pricing_discount role rather than fabricate it.
method_family: comparable_revenue
lens: bundle_consolidation
parent_lens_shape: null
realism_modifiers: []
inputs:
- name: tools_displaced
  role: base_value
  unit_signature:
    kind: flow
    dimension: currency
    currency: USD
  required: true
- name: consolidation_rate
  role: base_value
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: pricing_discount
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: tools_displaced * consolidation_rate * (1 - pricing_discount)
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
