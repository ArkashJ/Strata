kind: framework
slug: consolidation-sum-then-discount
schema_version: 1
name: "Consolidation sum-then-discount"

# Q7 method family — comparable_revenue (suite vendor captures share of
# existing point-solution spend).
method_family: comparable_revenue

# Q39 lens tag — bundle_consolidation (Microsoft 365 / Google Workspace math shape).
lens: bundle_consolidation
parent_lens_shape: consolidation-net-of-bundling-discount
realism_modifiers: [reduced]

# v0.2 simplification: 2-input displaced-spend × consolidation-rate product.
# The full Q39 bundle_consolidation math (tools_displaced × consolidation_rate
# × suite_premium_factor) lands when the suite-premium-factor primitive is
# seeded at v0.3.
inputs:
  - name: tools_displaced
    role: base_value
    unit_signature:
      kind: flow
      dimension: currency
      currency: USD
    required: true
  - name: consolidation_rate
    role: base_value
    unit_signature:
      kind: dimensionless
      dimension: percent
    required: true

formula: "tools_displaced * consolidation_rate"

output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: "per-year"

applicable_to:
  - workplace-suite-consolidation
  - echelon-servicenow-agents
