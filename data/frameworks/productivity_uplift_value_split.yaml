kind: framework
slug: productivity-uplift-value-split
schema_version: 1
name: "Productivity uplift value-split"

# Q7 method family — comparable_revenue (vendor captures ARPU-equivalent share
# of productivity value unlocked per engineer).
method_family: comparable_revenue

# Q39 lens tag — productivity_uplift (GitHub Copilot / Cursor math shape).
lens: productivity_uplift
parent_lens_shape: productivity-uplift-full
realism_modifiers: [reduced]

# v0.2 simplification: 2-input persona-count × vendor-value-split product. The
# full Q39 productivity_uplift math (persona × productivity_gain × capture_rate)
# lands when community-modeled productivity-gain and capture-rate slider
# primitives are seeded at v0.3.
inputs:
  - name: persona_count
    role: base_value
    unit_signature:
      kind: stock
      dimension: people
    required: true
  - name: value_split_to_vendor
    role: base_value
    unit_signature:
      kind: intensive
      dimension: currency
      currency: USD
    required: true

formula: "persona_count * value_split_to_vendor"

output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: "per-year"

applicable_to:
  - software-eng-productivity

variants:
  - scope: software-eng-productivity
    default_inputs:
      persona_count: bls-software-developers-us-2024
      value_split_to_vendor: dev-tool-arpu-2024

expansion_stage_parameter: false
horizon_class: snapshot
