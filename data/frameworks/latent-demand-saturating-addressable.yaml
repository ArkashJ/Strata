kind: framework
slug: latent-demand-saturating-addressable
schema_version: 1
name: Latent demand (addressable-narrowed saturating curve)

# Q39 lens — latent_demand. Distinct math shape: combines the saturating-exponential
# adoption curve (no early knee) WITH an addressable-share narrowing of the raw
# population. addressable_population x addressable_share x curve(position, k) x WTP.
# Structurally distinct from both the logistic and the plain saturating frameworks.
# Covers all three required latent_demand roles.
method_family: adoption_curve
lens: latent_demand
parent_lens_shape: latent-demand-adoption-curve
realism_modifiers: [addressable, saturating]
inputs:
- name: addressable_population
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_rate_curve
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: willingness_to_pay
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: addressable_population * addressable_share * curve(adoption_rate_curve, adoption_steepness) * willingness_to_pay
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- us-senior-digital-health
- india-consumer-digital-lending
variants:
- scope: us-senior-digital-health
  default_inputs:
    addressable_population: wb-us-population-65up-2023
    addressable_share: addressable-share-of-persona-pool-default-2024
    adoption_rate_curve: us-senior-digital-health-adoption-position-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    willingness_to_pay: us-senior-digital-health-wtp-per-person-2024
- scope: india-consumer-digital-lending
  default_inputs:
    addressable_population: wb-india-population-2023
    addressable_share: addressable-share-of-persona-pool-default-2024
    adoption_rate_curve: india-digital-lending-adoption-position-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
    willingness_to_pay: india-digital-lending-wtp-per-person-2024
expansion_stage_parameter: false
horizon_class: snapshot
