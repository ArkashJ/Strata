kind: framework
slug: throughput-adoption-gated
schema_version: 1
name: Throughput (adoption-gated share)

# Q39 lens — platform_throughput. Distinct math shape: the platform's realized
# share is gated by a saturating adoption curve (share ramps then saturates as the
# platform matures) rather than entering linearly. gmv_or_volume x take_rate x
# curve(market_share_assumption, adoption_steepness). Covers all three required
# platform_throughput roles.
method_family: adoption_curve
lens: platform_throughput
inputs:
- name: gmv_or_volume
  role: base_value
  unit_signature:
    kind: flow
    dimension: currency
    currency: USD
  required: true
- name: take_rate
  role: base_value
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: market_share_assumption
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: gmv_or_volume * take_rate * curve(market_share_assumption, adoption_steepness)
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- payments-throughput-pc-insurance
- voice-ai-infra-global
variants:
- scope: payments-throughput-pc-insurance
  default_inputs:
    gmv_or_volume: pc-premium-volume-digital-us-2024
    take_rate: payment-processing-take-rate-2024
    market_share_assumption: platform-market-share-assumption-default-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
- scope: voice-ai-infra-global
  default_inputs:
    gmv_or_volume: voice-ai-application-stack-revenue-global-2024
    take_rate: voice-ai-infra-layer-share-global-2024
    market_share_assumption: platform-market-share-assumption-default-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
expansion_stage_parameter: false
horizon_class: snapshot
