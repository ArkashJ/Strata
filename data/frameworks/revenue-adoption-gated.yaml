kind: framework
slug: revenue-adoption-gated
schema_version: 1
name: Revenue capture (adoption-gated)

# Q39 lens — revenue_generation. Distinct math shape: capture is gated by a
# saturating adoption curve (a challenger's share of segment spend ramps then
# saturates) rather than a flat fraction. target_segment_count x spend_per_target
# x curve(capture_rate, adoption_steepness). Covers all three required
# revenue_generation roles.
method_family: adoption_curve
lens: revenue_generation
inputs:
- name: target_segment_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: organizations
  required: true
- name: spend_per_target
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
- name: capture_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: target_segment_count * spend_per_target * curve(capture_rate, adoption_steepness)
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- midmarket-saas-spend-na
- doc-gen-pc-insurance
variants:
- scope: midmarket-saas-spend-na
  default_inputs:
    target_segment_count: census-midmarket-companies-na-2024
    spend_per_target: avg-saas-spend-midmarket-2024
    capture_rate: consolidation-capture-rate-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
- scope: doc-gen-pc-insurance
  default_inputs:
    target_segment_count: naic-active-pc-carriers-2024
    spend_per_target: pc-saas-spend-per-carrier-2024
    capture_rate: consolidation-capture-rate-2024
    adoption_steepness: saturating-adoption-rate-k-default-2024
expansion_stage_parameter: false
horizon_class: snapshot
