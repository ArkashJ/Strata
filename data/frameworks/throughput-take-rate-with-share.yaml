kind: framework
slug: throughput-take-rate-with-share
schema_version: 1
name: Throughput take-rate (with platform share)

# Q39 lens — platform_throughput. FULL-role-coverage variant of the v0.2 2-input
# throughput-take-rate: a single platform does not capture the whole take-rate
# pool, so it applies market_share_assumption. gmv_or_volume x take_rate x
# market_share_assumption. Clears the platform_throughput role warning.
method_family: value_chain
lens: platform_throughput
parent_lens_shape: null
realism_modifiers: []
inputs:
- name: gmv_or_volume
  role: base_value
  unit_signature:
    kind: flow
    dimension: currency
    currency: USD
  required: true
- name: take_rate
  role: base_value
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: market_share_assumption
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: gmv_or_volume * take_rate * market_share_assumption
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- payments-throughput-pc-insurance
- voice-ai-infra-global
- piramidal-eeg-multi-geo
- supermemory-ai-memory-infra
- sieve-multimodal-infra
variants:
- scope: payments-throughput-pc-insurance
  default_inputs:
    gmv_or_volume: pc-premium-volume-digital-us-2024
    take_rate: payment-processing-take-rate-2024
    market_share_assumption: platform-market-share-assumption-default-2024
- scope: voice-ai-infra-global
  default_inputs:
    gmv_or_volume: voice-ai-application-stack-revenue-global-2024
    take_rate: voice-ai-infra-layer-share-global-2024
    market_share_assumption: platform-market-share-assumption-default-2024
- scope: piramidal-eeg-multi-geo
  default_inputs:
    gmv_or_volume: global-eeg-neurodiagnostics-market-multi-geo-2024
    take_rate: eeg-ai-foundation-model-addressability-2024
    market_share_assumption: platform-market-share-assumption-default-2024
- scope: supermemory-ai-memory-infra
  default_inputs:
    gmv_or_volume: global-ai-application-stack-revenue-2024
    take_rate: memory-layer-share-of-ai-app-stack-2024
    market_share_assumption: platform-market-share-assumption-default-2024
- scope: sieve-multimodal-infra
  default_inputs:
    gmv_or_volume: global-multimodal-video-audio-app-stack-revenue-2024
    take_rate: multimodal-ai-infra-share-of-app-stack-2024
    market_share_assumption: platform-market-share-assumption-default-2024
expansion_stage_parameter: false
horizon_class: snapshot
