kind: framework
slug: productivity-uplift-full
schema_version: 1
name: Productivity uplift (full, with gain rate)

# Q39 lens — productivity_uplift. FULL-role-coverage variant of the v0.2 2-input
# productivity-uplift-value-split: it scales the per-persona value split by the
# realized productivity gain (not every persona realizes full uplift). persona_count
# x productivity_gain_pct x value_split_to_vendor. Clears the productivity_uplift
# role warning.
method_family: comparable_revenue
lens: productivity_uplift
parent_lens_shape: null
realism_modifiers: []
inputs:
- name: persona_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: productivity_gain_pct
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: value_split_to_vendor
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_count * productivity_gain_pct * value_split_to_vendor
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- software-eng-productivity
variants:
- scope: software-eng-productivity
  default_inputs:
    persona_count: bls-software-developers-us-2024
    productivity_gain_pct: productivity-gain-pct-default-2024
    value_split_to_vendor: dev-tool-arpu-2024
expansion_stage_parameter: false
horizon_class: snapshot
