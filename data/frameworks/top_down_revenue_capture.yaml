kind: framework
slug: top-down-revenue-capture
schema_version: 1
name: Top-down revenue capture
method_family: top_down_spend
lens: revenue_generation
inputs:
- name: target_segment_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: organizations
  required: true
- name: spend_per_target
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: target_segment_count * spend_per_target
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- doc-gen-pc-insurance
- midmarket-saas-spend-na
- yotta-india-cloud
- demo-ai-dev-tooling-us
- demo-ai-insurance-claims-us
- demo-ai-sales-ops-us
- demo-ai-clinical-docs-us
- demo-ai-legal-research-us
variants:
- scope: doc-gen-pc-insurance
  default_inputs:
    target_segment_count: naic-active-pc-carriers-2024
    spend_per_target: pc-saas-spend-per-carrier-2024
- scope: midmarket-saas-spend-na
  default_inputs:
    target_segment_count: census-midmarket-companies-na-2024
    spend_per_target: avg-saas-spend-midmarket-2024
- scope: yotta-india-cloud
  default_inputs:
    target_segment_count: yotta-india-regulated-enterprises-targetable-2024
    spend_per_target: yotta-india-sovereign-cloud-spend-per-enterprise-2024
- scope: demo-ai-dev-tooling-us
  default_inputs:
    target_segment_count: demo-census-cbp-5112-software-publishers-2022
