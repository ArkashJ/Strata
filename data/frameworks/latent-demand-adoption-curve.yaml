kind: framework
slug: latent-demand-adoption-curve
schema_version: 1
name: Latent demand (logistic adoption curve)

# Q39 lens — latent_demand (Uber / Airbnb / new-category math shape): a large
# addressable population that has NOT yet adopted, gated by an adoption S-curve.
# This is the first framework AND the first concepts for the L3 lens.
method_family: bottoms_up_seats

lens: latent_demand
parent_lens_shape: null
realism_modifiers: []

# addressable_population × logistic(position, midpoint, steepness) × WTP.
# The logistic factor is the adopted SHARE (dimensionless, in (0,1)); it is what
# distinguishes latent demand from a raw headcount — most of the population has
# not adopted yet. midpoint/steepness are dimensionless structural bounds of the
# curve (shared modeled diffusion parameters, not market-specific magnitudes).
# Required roles for the lens are addressable_population, adoption_rate_curve,
# willingness_to_pay (REQUIRED_PRIMITIVE_ROLES); the two logistic bounds are
# additional shape inputs.
inputs:
- name: addressable_population
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: adoption_rate_curve
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_midpoint
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: adoption_steepness
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: willingness_to_pay
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true

formula: addressable_population * logistic(adoption_rate_curve, adoption_midpoint, adoption_steepness) * willingness_to_pay

output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year

applicable_to:
- us-senior-digital-health
- india-consumer-digital-lending

variants:
- scope: us-senior-digital-health
  default_inputs:
    addressable_population: wb-us-population-65up-2023
    adoption_rate_curve: us-senior-digital-health-adoption-position-2024
    adoption_midpoint: logistic-adoption-midpoint-default-2024
    adoption_steepness: logistic-adoption-steepness-default-2024
    willingness_to_pay: us-senior-digital-health-wtp-per-person-2024
- scope: india-consumer-digital-lending
  default_inputs:
    addressable_population: wb-india-population-2023
    adoption_rate_curve: india-digital-lending-adoption-position-2024
    adoption_midpoint: logistic-adoption-midpoint-default-2024
    adoption_steepness: logistic-adoption-steepness-default-2024
    willingness_to_pay: india-digital-lending-wtp-per-person-2024

expansion_stage_parameter: false
horizon_class: snapshot
