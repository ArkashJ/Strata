kind: framework
slug: revenue-capture-bounded
schema_version: 1
name: Revenue capture (bounded capture rate)

# Q39 lens — revenue_generation. Distinct math shape: the capture_rate is clamped
# into [0,1] so a modeled rate can never imply capturing more than the whole
# segment spend. target_segment_count x spend_per_target x clamp(capture_rate,0,1).
# Full role coverage for revenue_generation.
method_family: top_down_spend
lens: revenue_generation
inputs:
- name: target_segment_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: organizations
  required: true
- name: spend_per_target
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
- name: capture_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: target_segment_count * spend_per_target * clamp(capture_rate, 0, 1)
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- midmarket-saas-spend-na
- doc-gen-pc-insurance
variants:
- scope: midmarket-saas-spend-na
  default_inputs:
    target_segment_count: census-midmarket-companies-na-2024
    spend_per_target: avg-saas-spend-midmarket-2024
    capture_rate: consolidation-capture-rate-2024
- scope: doc-gen-pc-insurance
  default_inputs:
    target_segment_count: naic-active-pc-carriers-2024
    spend_per_target: pc-saas-spend-per-carrier-2024
    capture_rate: consolidation-capture-rate-2024
expansion_stage_parameter: false
horizon_class: snapshot
