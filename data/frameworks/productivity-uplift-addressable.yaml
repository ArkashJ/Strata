kind: framework
slug: productivity-uplift-addressable
schema_version: 1
name: Productivity uplift (addressable-narrowed)

# Q39 lens — productivity_uplift. Distinct math shape: it narrows the persona base
# by an addressable share before applying productivity gain and the vendor split,
# so only the serviceable persona base contributes value. persona_count x
# addressable_share x productivity_gain_pct x value_split_to_vendor. Covers all
# three required productivity_uplift roles.
method_family: comparable_revenue
lens: productivity_uplift
inputs:
- name: persona_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: productivity_gain_pct
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: value_split_to_vendor
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_count * addressable_share * productivity_gain_pct * value_split_to_vendor
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- software-eng-productivity
variants:
- scope: software-eng-productivity
  default_inputs:
    persona_count: bls-software-developers-us-2024
    addressable_share: addressable-share-of-persona-pool-default-2024
    productivity_gain_pct: productivity-gain-pct-default-2024
    value_split_to_vendor: dev-tool-arpu-2024
expansion_stage_parameter: false
horizon_class: snapshot
