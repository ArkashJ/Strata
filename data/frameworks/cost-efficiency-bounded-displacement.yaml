kind: framework
slug: cost-efficiency-bounded-displacement
schema_version: 1
name: Cost efficiency (bounded displacement)

# Q39 lens — cost_efficiency. Distinct math shape: the combined addressable x
# replacement modifier is CLAMPED into [0,1] before scaling the pool, so a
# stacked pair of modeled fractions can never imply >100% displacement (an
# analyst guardrail the plain product lacks). persona_pool x
# clamp(addressable_share * replacement_rate, 0, 1) x cost_per_persona.
# Full role coverage for cost_efficiency.
method_family: bottoms_up_seats
lens: cost_efficiency
parent_lens_shape: cost-efficiency-full-displacement
realism_modifiers: [bounded]
inputs:
- name: persona_pool
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: replacement_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: cost_per_persona
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_pool * clamp(addressable_share * replacement_rate, 0, 1) * cost_per_persona
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- ai-coding-assistants-us
- doc-gen-pc-insurance
- wraithwatch-cyber-defense
variants:
- scope: ai-coding-assistants-us
  default_inputs:
    persona_pool: us-software-engineering-workforce
    addressable_share: addressable-share-of-persona-pool-default-2024
    replacement_rate: incumbent-replacement-rate-default-2024
    cost_per_persona: ai-coding-assistant-acv-per-engineer-2024
- scope: doc-gen-pc-insurance
  default_inputs:
    persona_pool: bls-pc-claims-adjusters-headcount
    addressable_share: addressable-share-of-persona-pool-default-2024
    replacement_rate: incumbent-replacement-rate-default-2024
    cost_per_persona: pc-claims-adjuster-cost-per-seat
- scope: wraithwatch-cyber-defense
  default_inputs:
    persona_pool: global-ai-addressable-secops-personas-2024
    addressable_share: addressable-share-of-persona-pool-default-2024
    replacement_rate: incumbent-replacement-rate-default-2024
    cost_per_persona: global-blended-secops-vendor-capture-per-persona-2024
expansion_stage_parameter: false
horizon_class: snapshot
