kind: framework
slug: revenue-capture-addressable
schema_version: 1
name: Revenue capture (addressable-narrowed)

# Q39 lens — revenue_generation. Distinct math shape: it narrows the target
# segment by an addressable share before spend and capture, so only serviceable
# accounts contribute. target_segment_count x addressable_share x spend_per_target
# x capture_rate. Covers all three required revenue_generation roles.
method_family: top_down_spend
lens: revenue_generation
parent_lens_shape: revenue-capture-full
realism_modifiers: [addressable]
inputs:
- name: target_segment_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: organizations
  required: true
- name: addressable_share
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: spend_per_target
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
- name: capture_rate
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
formula: target_segment_count * addressable_share * spend_per_target * capture_rate
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- midmarket-saas-spend-na
- doc-gen-pc-insurance
variants:
- scope: midmarket-saas-spend-na
  default_inputs:
    target_segment_count: census-midmarket-companies-na-2024
    addressable_share: addressable-share-of-persona-pool-default-2024
    spend_per_target: avg-saas-spend-midmarket-2024
    capture_rate: consolidation-capture-rate-2024
- scope: doc-gen-pc-insurance
  default_inputs:
    target_segment_count: naic-active-pc-carriers-2024
    addressable_share: addressable-share-of-persona-pool-default-2024
    spend_per_target: pc-saas-spend-per-carrier-2024
    capture_rate: consolidation-capture-rate-2024
expansion_stage_parameter: false
horizon_class: snapshot
