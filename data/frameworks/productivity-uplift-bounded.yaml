kind: framework
slug: productivity-uplift-bounded
schema_version: 1
name: Productivity uplift (bounded gain)

# Q39 lens — productivity_uplift. Distinct math shape: the productivity gain is
# clamped into [0,1] so a modeled uplift can never exceed a full doubling-share
# of baseline value. persona_count x clamp(productivity_gain_pct,0,1) x
# value_split_to_vendor. Full role coverage for productivity_uplift.
method_family: comparable_revenue
lens: productivity_uplift
inputs:
- name: persona_count
  role: base_value
  unit_signature:
    kind: stock
    dimension: people
  required: true
- name: productivity_gain_pct
  role: regime_modifier
  unit_signature:
    kind: dimensionless
    dimension: percent
  required: true
- name: value_split_to_vendor
  role: base_value
  unit_signature:
    kind: intensive
    dimension: currency
    currency: USD
  required: true
formula: persona_count * clamp(productivity_gain_pct, 0, 1) * value_split_to_vendor
output_unit:
  kind: flow
  dimension: currency
  currency: USD
  denominator: per-year
applicable_to:
- software-eng-productivity
variants:
- scope: software-eng-productivity
  default_inputs:
    persona_count: bls-software-developers-us-2024
    productivity_gain_pct: productivity-gain-pct-default-2024
    value_split_to_vendor: dev-tool-arpu-2024
expansion_stage_parameter: false
horizon_class: snapshot
