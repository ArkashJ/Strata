name: "P&C insurance payment processing throughput"
definition: >
  US property & casualty insurance premium payment processing — digital
  premium collection, claims disbursement, and commission payments flowing
  through payment-processor rails. Measures the addressable gross monetary
  throughput on which payment infrastructure providers earn take-rate revenue.
  Excludes life and health insurance lines; excludes non-digital (cheque/ACH
  legacy) payment volumes.

