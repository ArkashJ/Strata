name: Miravoice - AI Phone Surveys replacing CATI
definition: AI voice agents conducting outbound/inbound telephone surveys, displacing
  CATI (computer-aided telephone interviewing) labor and traditional survey call centers
  globally. Scope is the global market research industry's telephone data-collection
  spend, regulated under data-protection regimes (GDPR, TCPA) per jurisdiction. Lens
  is consolidation of the CATI labor + call-center spend pool into an AI voice platform.
