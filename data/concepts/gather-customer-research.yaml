name: Gather — AI Customer Research Agent
definition: Gather is a global SaaS AI agent that conducts customer research (qualitative
  interviews, survey synthesis, VoC analysis) for marketing and product teams, displacing
  qualitative researcher headcount, expert-network subscriptions (GLG/AlphaSights),
  and survey platforms (Qualtrics/UserTesting). Global scope, no regulatory gates.
