kind: concept
slug: demo-ai-sales-ops-us
schema_version: 1
name: AI sales-ops tooling (US sales reps)
definition: 'US adoption of AI sales-operations and revenue-intelligence tooling priced
  per sales-rep seat. Scope: US business-to-business sales representatives; excludes
  retail floor staff.'
analysis_lens:
  primary: cost_efficiency
  secondary: revenue_generation
modifiers: {}
# Declared market scope (sub-project 1). Sales reps span every industry, so no
# vertical is declared. Persona is ALL B2B sales reps (services + wholesale/mfg);
# segment is explicitly all employer firms so any mid-market-only primitive reads
# as narrowing the market. Retail floor staff are excluded.
scope:
  persona:
  - system: SOC
    code: "41-3000"
    label: Sales representatives, services
  - system: SOC
    code: "41-4000"
    label: Sales representatives, wholesale & manufacturing
  segment:
    label: All employer firms
  geo_supply:
  - US
  geo_demand:
  - US
  product:
  - ai-sales-ops-tooling
  - revenue-intelligence
  exclude:
  - Retail floor staff (SOC 41-2031)
measurements:
- demo-bls-sales-reps-us-2024
- demo-acs-sales-reps-us-2024
- demo-ai-sales-ops-acv-per-seat-2024
- demo-census-midmarket-firms-us-2022
- demo-midmarket-ai-sales-spend-2024
competing_concepts:
- demo-ai-dev-tooling-us
requires_clearance: []
