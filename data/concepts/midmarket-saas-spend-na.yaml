name: "Midmarket SaaS spend North America"
definition: >
  Total annual SaaS software spending by North American midmarket companies
  (100–999 employees) — covering horizontal productivity suites, vertical
  industry software, finance/HR/IT management tools, and emerging AI-native
  applications delivered as subscription software. Excludes on-premise
  licences, custom-built software, and infrastructure (IaaS/PaaS).

