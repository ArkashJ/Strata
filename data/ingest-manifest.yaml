          geo_codes: [GBR]
          geo_level: country
          unit_kind: flow
          unit_dimension: currency
          unit_currency: GBP
          value_scale: 1000000

  # ── Eurostat — EU national accounts (regulator, keyless). GDP is CP_MEUR
