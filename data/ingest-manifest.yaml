  # NATIONAL currency. ────────────────────────────────────────────────────
  oecd:
    - method: get_gdp
      arg_sets:
        - country: DEU
          year: 2022
          concept_slug: oecd-gdp-deu
          primitive_slug: oecd-gdp-deu-2022
          name: Germany GDP, expenditure approach (OECD national accounts)
          description: Germany GDP at current prices, absolute EUR (OECD reports DSD_NAMAIN10 B1GQ in millions; value_scale lifts it to base units).
          source_url: https://data.oecd.org/
          geo_codes: [DEU]
          geo_level: country
          unit_kind: flow
          unit_dimension: currency
          unit_currency: EUR
          value_scale: 1000000
        - country: GBR
          year: 2022
          concept_slug: oecd-gdp-gbr
          primitive_slug: oecd-gdp-gbr-2022
