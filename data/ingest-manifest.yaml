# Declarative ingest manifest — the static counterpart to the LLM router.
#
# `strata ingest run` walks this file: for each connector method, every
# arg_set becomes one connector call. An arg_set carries BOTH the connector
# method arguments (series_id, indicator, cik, ...) AND the converter metadata
# (primitive_slug, concept_slug, name, description, source_url, unit_*).
# `connectors._dispatch.call_and_convert` splits the two by signature.
#
# Connectors whose STRATA_<X>_API_KEY is unset are skipped (logged, batch
# continues). Keyless connectors (edgar, worldbank, oecd, eurostat, faa,
# fdic, cms, ...) always run.
#
# Slugs MUST be kebab-case (^[a-z0-9][a-z0-9-]*$). Keep one arg_set per
# distinct primitive you want in the bank. Every source_url host MUST be in
# resolver.citations.CONNECTOR_HOSTS or the writer rejects the primitive.
#
# DISPATCH TRAP CHECKLIST (see plan): a (connector, method, converter) triple
# is only ingest-ready once it (1) has no converter-keyword/method-arg name
# collision and (2) the method's response actually carries the dataclass the
# converter's positional needs. Each block below is single-record by design so
# _match_positional hands the converter exactly one row.

connectors:

  # ── FRED — US macro (regulator). observations_only converter. ──────────
  fred:
    - method: get_observations
      arg_sets:
        - series_id: GDP
          primitive_slug: fred-us-gdp-nominal
          concept_slug: us-gdp
          name: US nominal GDP (FRED GDP, billions USD)
          description: US nominal gross domestic product, latest annual observation (billions of USD).
          source_url: https://fred.stlouisfed.org/series/GDP
          unit_kind: flow
          unit_dimension: currency
          unit_currency: USD
        - series_id: PCEC
          primitive_slug: fred-us-personal-consumption
          concept_slug: us-personal-consumption
          name: US personal consumption expenditures (FRED PCEC, billions USD)
          description: US personal consumption expenditures, latest observation (billions of USD).
          source_url: https://fred.stlouisfed.org/series/PCEC
          unit_kind: flow
          unit_dimension: currency
          unit_currency: USD
  # ── BLS — employment + occupation wages (regulator). ───────────────────
  bls:
    - method: get_series
      arg_sets:
        - series_id: CES0000000001
          primitive_slug: bls-us-total-nonfarm-employment
          concept_slug: us-employment
          name: US total nonfarm employment (BLS CES0000000001)
          description: Total nonfarm payroll employment, seasonally adjusted, latest point.
          source_url: https://www.bls.gov/ces/
          unit_kind: stock
          unit_dimension: people
    # OEWS national occupation employment + wages. occ_code (6-digit SOC),
    # area (0000000 = national), datatype (01 = employment, 04 = annual mean
    # wage) route to the method; none collide with converter keywords. No
    # `year:` here — that IS a converter keyword and would select a data point
    # rather than reach the method.
    - method: get_oes_employment
      arg_sets:
        - occ_code: "15-1252"
          area: "0000000"
          datatype: "01"
          concept_slug: us-software-developer-labor
          primitive_slug: bls-oews-software-developers-employment
          name: US software developers — national employment (OEWS 15-1252)
          description: National employment of software developers — persona headcount for AI-coding-assistant TAMs.
          source_url: https://www.bls.gov/oes/current/oes151252.htm
          unit_kind: stock
          unit_dimension: people
        - occ_code: "15-1252"
          area: "0000000"
          datatype: "04"
          concept_slug: us-software-developer-labor
          primitive_slug: bls-oews-software-developers-mean-wage
          name: US software developers — national annual mean wage (OEWS 15-1252)
          description: National annual mean wage of software developers — cost-per-persona input for AI-coding cost-efficiency TAMs.
          source_url: https://www.bls.gov/oes/current/oes151252.htm
          unit_kind: flow
          unit_dimension: currency
          unit_currency: USD
          unit_denominator: year
        - occ_code: "43-4051"
          area: "0000000"
          datatype: "01"
          concept_slug: us-customer-service-rep-labor
          primitive_slug: bls-oews-customer-service-reps-employment
          name: US customer service representatives — national employment (OEWS 43-4051)
          description: National employment of customer service reps — persona headcount for AI-support-agent automation TAMs.
          source_url: https://www.bls.gov/oes/current/oes434051.htm
          unit_kind: stock
          unit_dimension: people
        - occ_code: "43-4051"
          area: "0000000"
          datatype: "04"
          concept_slug: us-customer-service-rep-labor
          primitive_slug: bls-oews-customer-service-reps-mean-wage
          name: US customer service representatives — national annual mean wage (OEWS 43-4051)
          description: National annual mean wage of customer service reps — cost-per-persona input for AI-support-deflection TAMs.
          source_url: https://www.bls.gov/oes/current/oes434051.htm
          unit_kind: flow
          unit_dimension: currency
          unit_currency: USD
          unit_denominator: year
        - occ_code: "23-1011"
          area: "0000000"
          datatype: "01"
          concept_slug: us-lawyer-labor
          primitive_slug: bls-oews-lawyers-employment
          name: US lawyers — national employment (OEWS 23-1011)
          description: National employment of lawyers — persona headcount for AI-legal-assistant productivity TAMs.
          source_url: https://www.bls.gov/oes/current/oes231011.htm
          unit_kind: stock
          unit_dimension: people
        - occ_code: "23-1011"
          area: "0000000"
          datatype: "04"
          concept_slug: us-lawyer-labor
          primitive_slug: bls-oews-lawyers-mean-wage
          name: US lawyers — national annual mean wage (OEWS 23-1011)
          description: National annual mean wage of lawyers — cost-per-persona input for AI-legal cost-efficiency TAMs.
          source_url: https://www.bls.gov/oes/current/oes231011.htm
          unit_kind: flow
          unit_dimension: currency
          unit_currency: USD
          unit_denominator: year
        - occ_code: "41-4012"
          area: "0000000"
          datatype: "01"
          concept_slug: us-sales-rep-labor
          primitive_slug: bls-oews-sales-reps-employment
          name: US wholesale & manufacturing sales reps — national employment (OEWS 41-4012)
          description: National employment of sales reps — persona headcount for AI-sales-ops automation TAMs.
          source_url: https://www.bls.gov/oes/current/oes414012.htm
          unit_kind: stock
          unit_dimension: people

  # ── Census — establishment/firm counts by NAICS (regulator). ───────────
  # CBP → establishments/employees (default converter industry_to_primitive_yaml);
  # get_susb → true firm counts via the Annual Business Survey Company Summary
  # (abscs FIRMPDEMP) — SUSB has NO Census Data API; abscs is the live firm-count
  # equivalent (override firm_to_primitive_yaml). Single NAICS per arg_set so
  # _match_positional gets exactly one industry/firm record. Hosts are the www.
  # pages (api.census.gov is NOT in CONNECTOR_HOSTS).
  census:
    - method: get_cbp
      arg_sets:
        - year: 2022
          naics: "5415"
          concept_slug: us-computer-systems-design-market
          primitive_slug: census-cbp-5415-establishments-2022
          name: US computer systems design establishments (NAICS 5415, CBP 2022)
          description: Count of US establishments in computer systems design & related services — firm denominator for AI-services TAMs.
          source_url: https://www.census.gov/programs-surveys/cbp.html
          unit_kind: stock
          unit_dimension: organizations
          value_field: establishments
        - year: 2022
          naics: "5415"
          concept_slug: us-computer-systems-design-market
          primitive_slug: census-cbp-5415-employees-2022
          name: US computer systems design employment (NAICS 5415, CBP 2022)
          description: Paid employees in US computer systems design & related services — headcount denominator for productivity-uplift AI lenses.
          source_url: https://www.census.gov/programs-surveys/cbp.html
          unit_kind: stock
          unit_dimension: people
          value_field: employees
        - year: 2022
          naics: "5112"
          concept_slug: us-software-publishing-market
          primitive_slug: census-cbp-5112-establishments-2022
          name: US software publisher establishments (NAICS 5112, CBP 2022)
          description: Count of US software-publishing establishments — denominator for software-bundle AI TAMs.
          source_url: https://www.census.gov/programs-surveys/cbp.html
          unit_kind: stock
          unit_dimension: organizations
          value_field: establishments
        - year: 2022
          naics: "5182"
          concept_slug: us-data-processing-hosting-market
          primitive_slug: census-cbp-5182-establishments-2022
          name: US data processing & hosting establishments (NAICS 5182, CBP 2022)
          description: Count of US data-processing, hosting and related-services establishments — infra denominator for AI-compute TAMs.
          source_url: https://www.census.gov/programs-surveys/cbp.html
          unit_kind: stock
          unit_dimension: organizations
          value_field: establishments
        - year: 2022
          naics: "5416"
          concept_slug: us-management-consulting-market
          primitive_slug: census-cbp-5416-establishments-2022
          name: US management/scientific consulting establishments (NAICS 5416, CBP 2022)
          description: Count of US management & scientific consulting establishments — denominator for AI-consulting / decision-support TAMs.
          source_url: https://www.census.gov/programs-surveys/cbp.html
          unit_kind: stock
          unit_dimension: organizations
          value_field: establishments
    - method: get_susb
      arg_sets:
        - year: 2021
          naics: "5415"
          concept_slug: us-computer-systems-design-market
          primitive_slug: census-susb-5415-firms-2021
          name: US computer systems design employer firms (NAICS 5415, ABS 2021)
          description: Count of US employer firms (enterprises, not establishments) in computer systems design (Census Annual Business Survey Company Summary, FIRMPDEMP) — true buyer denominator for AI-services TAMs.
          source_url: https://www.census.gov/programs-surveys/abs.html
          unit_kind: stock
          unit_dimension: organizations
          value_field: firms
        - year: 2021
          naics: "5112"
          concept_slug: us-software-publishing-market
          primitive_slug: census-susb-5112-firms-2021
          name: US software publisher employer firms (NAICS 5112, ABS 2021)
          description: Count of US software-publishing employer firms (enterprises) (Census Annual Business Survey Company Summary, FIRMPDEMP) — true firm denominator for software-bundle AI TAMs.
          source_url: https://www.census.gov/programs-surveys/abs.html
          unit_kind: stock
          unit_dimension: organizations
          value_field: firms

  # ── EDGAR — SEC XBRL frames (regulator, keyless). ──────────────────────
  edgar:
    - method: get_frames
      arg_sets:
        - taxonomy: us-gaap
          concept: Assets
          unit: USD
          period: CY2023Q4I
          primitive_slug: edgar-us-gaap-assets-2023
          concept_slug: us-public-company-assets
          name: US public-company total assets, CY2023Q4 (SEC EDGAR frames)
          description: Sum of reported total assets across all us-gaap filers for the period.
          source_url: https://www.sec.gov/cgi-bin/browse-edgar
          unit_kind: stock
          unit_dimension: currency
          unit_currency: USD

  # ── World Bank — international macro (aggregator, keyless). ─────────────
  # get_indicator is the ONLY dispatchable method. Indicator codes live-
  # verified. country = ISO-3; geo_codes set per country so geo isn't US.
  worldbank:
