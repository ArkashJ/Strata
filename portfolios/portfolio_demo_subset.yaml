unsizable:
  - name: "0xPass"
    domain: "0xpass.io"
    vertical: "Web3 & Crypto"
    market: web3-wallet-infrastructure
    reason: "Wallet infrastructure (WaaS). Demand side IS sourced — 23,613 monthly-active web3 developers (Electric Capital 2024). What's missing is a primary source for infra-spend-per-developer; we refuse to reproduce the analyst ~$2B WaaS market report as our TAM (Q26). That one missing leg — not any Q20 quarantine — is the proven gap a revenue-capture lens + a first-party billing source must close next."
  - name: "3Blocks"
    domain: "3blocks.io"
    vertical: "Web3 & Crypto"
    market: onchain-analytics-software
    reason: "On-chain analytics SaaS — not on-chain signal *values* (onchain-tier values are framework-legal; only prediction_market is quarantined, Q20). Demand side is sourced (web3 developer count); no primary source exists for the analytics seat price or seat count, and we refuse to reproduce the analyst ~$3.4B market report (Q26). The missing first-party billing leg is the proven gap → next lens."
  - name: "Bebopbee"
    domain: "bebopbee.com"
    vertical: "Gaming"
    reason: "Mobile gaming monetization needs a player-LTV lens we have not sourced. Proven gap → P3."
  - name: "Drosera"
    domain: "drosera.bio"
    vertical: "Biotech"
    reason: "Wet-lab biotech requires a clinical-pipeline / drug-value lens outside our six current frameworks."
  - name: "Augrade"
    domain: "augrade.com"
    vertical: "AR & VR"
    reason: "AR/VR construction tooling — no spatial-computing adoption lens sourced; refusing to fabricate one."
