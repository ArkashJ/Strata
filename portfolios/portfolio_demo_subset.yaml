# Curated portfolio demo subset (spec F5).
#
# ~25 real companies from "Cos list.csv" hand-picked so their verticals map onto
# markets our frameworks + connectors actually cover. Each `market` is an
# existing sourced Concept slug; the pre-size step (scripts/presize_demo.py)
# sizes these OFFLINE and writes data/demo/portfolio_demo.json — the cached,
# deterministic artifact the /portfolio page and /tam render from. NO live
# LLM/Exa is ever on the demo path (F3).
#
# The ~5 `unsizable` rows are deliberate: framing the platform's REFUSAL to
# invent a number as the product's honesty, not a gap (the Q20 thesis made
# visible). Each carries an explicit reason that doubles as a P3 lens-gap signal.

