id: no-direct-anthropic-sdk
language: python
severity: error
message: >-
  Do not instantiate the Anthropic SDK directly. Route LLM calls through
  strata.resolver.llm.complete(), which owns the backend switch (Claude Code
  subscription CLI by default; SDK only on STRATA_LLM_BACKEND=anthropic) and the
  ANTHROPIC_API_KEY env scrub. A stray direct client re-introduces the dead-key
  "feels mock" failure (SP-1 W1).
note: |
  Only backend/src/strata/resolver/llm.py (_complete_sdk) may construct
  anthropic.Anthropic. See docs/superpowers/specs/2026-05-28-sp1-real-visual-tam-answers-design.md
files:
  - "backend/src/**/*.py"
ignores:
  # Location-independent glob: the one file allowed to construct the SDK,
  # regardless of the directory ast-grep is invoked from.
  - "**/strata/resolver/llm.py"
rule:
  pattern: anthropic.Anthropic($$$)
