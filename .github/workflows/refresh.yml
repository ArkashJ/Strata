# Scheduled data refresh. Pulls the latest numbers from the connectors and, if
# any YAML changed, opens a PR for review (data is never auto-merged).
#
#   cron (weekly) → strata ingest refresh → git diff?
#         │                                    │
#         │                              yes → open PR
#         └── manual run via workflow_dispatch │
#                                         no  → no-op
#
# `strata ingest refresh` lands with the ingest-orchestrator branch; this
# workflow is the consumer that runs it on a schedule once that ships.
name: refresh

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Connector keys come from repo secrets; absent keys → connector skips.
      STRATA_BLS_API_KEY: ${{ secrets.STRATA_BLS_API_KEY }}
      STRATA_FRED_API_KEY: ${{ secrets.STRATA_FRED_API_KEY }}
      STRATA_CENSUS_API_KEY: ${{ secrets.STRATA_CENSUS_API_KEY }}
      STRATA_EIA_API_KEY: ${{ secrets.STRATA_EIA_API_KEY }}
      STRATA_USDA_NASS_API_KEY: ${{ secrets.STRATA_USDA_NASS_API_KEY }}
      STRATA_OPENFDA_API_KEY: ${{ secrets.STRATA_OPENFDA_API_KEY }}
      STRATA_COMTRADE_API_KEY: ${{ secrets.STRATA_COMTRADE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Refresh data bank from connectors
        run: uv run strata ingest refresh

      - name: Open PR with changed YAML
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: scheduled connector refresh"
          branch: data/scheduled-refresh
          delete-branch: true
          title: "data: scheduled connector refresh"
          body: |
            Automated refresh from `strata ingest refresh`.

            Review the diff before merging — these are sourced numbers and
            every changed primitive should still trace to a valid snapshot.
          labels: data, automated
          add-paths: |
            data/**
