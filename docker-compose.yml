# `docker compose up` — Postgres + API + web. One-command boot for local dev.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports: ["5432:5432"]
    volumes:
      - strata_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STRATA_ENV: dev
      STRATA_LOG_LEVEL: INFO
      STRATA_LOG_JSON: "true"
      STRATA_DATABASE_URL: postgresql+asyncpg://strata:strata@db:5432/strata
      STRATA_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      STRATA_DATA_DIR: /app/data
      # Run migrations + seed YAML into Postgres on first boot (entrypoint.sh).
      STRATA_SEED_ON_BOOT: "1"
      # Container has no `claude` CLI, so the resolver uses the Anthropic SDK path.
      # Keys interpolate from the gitignored root .env — never committed.
      STRATA_LLM_BACKEND: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    ports: ["8000:8000"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [api]
    # NEXT_PUBLIC_* are baked at build; this supplies CLERK_SECRET_KEY at runtime
    # (the runner stage doesn't copy .env.local, so the auth middleware needs it here).
    env_file:
      - ./web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3001:3000"]

volumes:
  strata_pg:
