# Declarative ingest manifest (Session 3 — ingest + freshness).
#
# WHY: the orchestrator is connector-agnostic — it iterates
# connectors._capability.all_capabilities() and only ingests a (connector,
# method) pair that appears here. Adding a number to the data bank means
# editing this file, not the orchestrator. Each arg-set is one primitive:
# it carries BOTH the connector method arguments AND the converter metadata
# (concept_slug, primitive_slug, name, ...) that call_and_convert splits by
# signature introspection.
#
# `requires_key` names an env var the connector needs; when it is unset the
# orchestrator skips the whole connector (logged, never fatal) so an offline
# `ingest run --tier regulator` still succeeds on the keyless connectors.

connectors:
  edgar:
    methods:
      # XBRL frames aggregate one concept across every filer for a period — a
      # macro number (total reported assets), not a single company's figure.
      get_frames:
        - taxonomy: us-gaap
          concept: Assets
          unit: USD
          period: CY2023Q4I
          aggregation: sum
          concept_slug: us-corporate-assets
          primitive_slug: edgar-frames-assets-2023q4
          name: US-GAAP reported total assets (CY2023 Q4 instant)
          description: Sum of Assets across SEC filers from XBRL frames.
          source_url: https://www.sec.gov/cgi-bin/srqsb
          unit_kind: stock
          unit_dimension: currency
          unit_currency: USD

  # --- key-gated regulator connectors (skipped offline) ----------------
  bls:
    requires_key: STRATA_BLS_API_KEY
    methods:
      get_latest:
        - series_id: CUUR0000SA0
          concept_slug: us-consumer-price-index
          primitive_slug: bls-cpi-all-urban
          name: US CPI-U (all items)
          description: Consumer Price Index for All Urban Consumers, all items.
          source_url: https://www.bls.gov/cpi/
          unit_kind: stock
          unit_dimension: index

  fred:
    requires_key: STRATA_FRED_API_KEY
    methods:
      get_observations:
        - series_id: GDP
          concept_slug: us-gdp
          primitive_slug: fred-us-gdp
          name: US nominal GDP
          description: US gross domestic product, nominal, from FRED.
          source_url: https://fred.stlouisfed.org/series/GDP
          unit_kind: flow
          unit_dimension: currency
          unit_currency: USD

  census:
    requires_key: STRATA_CENSUS_API_KEY
    methods:
      get_cbp:
        - naics: "5415"
          year: 2022
          concept_slug: us-computer-systems-design-industry
          primitive_slug: census-cbp-5415-employment-2022
          name: US computer systems design employment (NAICS 5415, 2022)
          description: Employment in NAICS 5415 from Census County Business Patterns.
          source_url: https://www.census.gov/programs-surveys/cbp.html
          unit_kind: stock
          unit_dimension: people
          value_field: employees
