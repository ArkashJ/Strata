[project]
name = "strata"
version = "0.7.0"
description = "Proprietary curated market-sizing engine — primitives, frameworks, and a defensible TAM."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Arkash Jain", email = "arkash@benmore.tech" }]
keywords = ["tam", "market-sizing", "venture-capital", "primitives", "frameworks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "structlog>=24.1,<25",
    "exa-py>=2.13.0",
    "python-dotenv>=1.2.2",
    "anthropic>=0.104.1",
    "httpx>=0.27,<1",
    "cryptography>=48.0.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pyright>=1.1.380",
    "ruff>=0.6,<1",
    "types-pyyaml>=6,<7",
]

[project.scripts]
strata = "strata.cli:app"
strata-mcp = "strata.mcp.server:main"

[project.urls]
Homepage = "https://github.com/anthropics/strata"
Repository = "https://github.com/anthropics/strata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — ruff format handles
]

# `×` (multiplication sign) and `−` (minus sign) are deliberate domain notation
# in TAM angle/method strings — not typos for ASCII `x` / `-`.
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
# test_connectors.py groups per-connector imports under section banners
# mid-file for readability; these are intentional non-top-level imports.
"tests/test_connectors.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
