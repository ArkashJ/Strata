[build]
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "data/**"]

[deploy]
# Alternative to the Docker CMD. Railway runs this after build; it does the
# same migrate → (optional) seed → uvicorn sequence as backend/entrypoint.sh.
#
#   alembic upgrade head → uvicorn (Railway injects $PORT)
#
# Set STRATA_SEED_ON_BOOT=1 in the service variables for a fresh DB to also
# load the baked-in YAML seed data. The script reads it; nothing to change here.
startCommand = "./entrypoint.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
